<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="raqim">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>raqim</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: #ffffff;
    }

    #raqim-boot {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #ffffff;
      color: #004c69;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 15px;
      font-weight: 600;
    }

    #raqim-boot .mark {
      width: 96px;
      height: 96px;
      border-radius: 26px;
      background: #e6f6f1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #00a572;
      font-size: 42px;
      font-weight: 800;
    }

    #raqim-boot .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #e5f1f6;
      border-top-color: #00a572;
      border-radius: 50%;
      animation: raqim-spin 0.8s linear infinite;
    }

    @keyframes raqim-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <div id="raqim-boot">
    <div class="mark">ر</div>
    <div class="spinner"></div>
    <div>جارٍ تحميل رقيم…</div>
  </div>
  <script>
    (function () {
      function hideBoot() {
        var el = document.getElementById('raqim-boot');
        if (el && el.parentNode) el.parentNode.removeChild(el);
      }
      window.addEventListener('flutter-first-frame', hideBoot);
      // Safety net if the engine event is unavailable.
      setTimeout(hideBoot, 15000);
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
